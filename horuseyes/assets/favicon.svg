<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="goldGaze" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff59d"/>
      <stop offset="45%" stop-color="#ffd700"/>
      <stop offset="85%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#b78103"/>
    </radialGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Obsidian Circle -->
  <circle cx="32" cy="32" r="30" fill="#06070a" stroke="#ffd700" stroke-width="2"/>
  <!-- Eyebrow -->
  <path d="M 12 18 Q 32 8 52 18" fill="none" stroke="url(#goldGaze)" stroke-width="3" stroke-linecap="round" filter="url(#goldGlow)"/>
  <!-- Sclera -->
  <path d="M 10 30 Q 32 14 54 30 Q 32 46 10 30 Z" fill="#0a0d14" stroke="#ffd700" stroke-width="2.2" filter="url(#goldGlow)"/>
  <!-- Iris & Pupil -->
  <circle cx="32" cy="30" r="8" fill="url(#goldGaze)"/>
  <circle cx="32" cy="30" r="4.2" fill="#000000"/>
  <circle cx="33.5" cy="28.5" r="1.5" fill="#ffffff"/>
  <!-- Tear & Spiral -->
  <path d="M 32 44 L 32 55" fill="none" stroke="#ffd700" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 44 38 Q 38 52 46 56 Q 52 52 48 46" fill="none" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>
</svg>
